name: Verify course
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.8.18
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check README and notebook synchronization
        run: uv run --frozen python scripts/sync_materials.py --check
      - name: Check local links and notebook structure
        run: uv run --frozen python scripts/check_materials.py
      - name: Verify behavioral contracts
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Run every Python lesson
        run: uv run --frozen python scripts/verify_course.py
      - name: Run every notebook
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen python scripts/verify_course.py --mode notebooks
      - name: Run copied Python blocks from READMEs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen python scripts/verify_course.py --mode readmes
  mojo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.8.18
      - name: Install locked Mojo environment
        run: |
          uv venv .venv-mojo --python 3.12
          uv pip sync --python .venv-mojo/bin/python mojo/requirements.lock
      - name: Compile lessons and compare with Python references
        run: .venv-mojo/bin/python scripts/verify_mojo.py

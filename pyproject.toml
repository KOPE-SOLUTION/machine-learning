[project]
name = "machine-learning-th"
version = "0.1.0"
description = "Hands-on machine learning in Thai with Python and optional Mojo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.2", "scikit-learn==1.7.1",
  "matplotlib==3.10.3", "scipy==1.16.1", "joblib==1.5.1",
  "jupyterlab==4.4.6", "ipykernel==6.30.1",
  "nbformat==5.10.4", "nbclient==0.10.2",
]

[tool.uv]
package = false
